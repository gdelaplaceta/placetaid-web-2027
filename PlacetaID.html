:root{--bg:#2b0f54;--deep:#1c0836;--main:#6d28d9;--mid:#8b5cf6;--soft:#c4b5fd;--pale:#efe8ff;--ink:#1c0836;--txt:#f5f0ff;--cardtxt:#2b0f54;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--txt);font:600 .95rem/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3,.b{font-family:Baruta,"Plus Jakarta Sans",sans-serif;font-weight:400;line-height:1;margin:0}
:focus-visible{outline:3px solid var(--soft);outline-offset:3px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;gap:12px;flex-wrap:wrap}
nav .b{font-size:1.1rem}nav div{display:flex;gap:22px}nav a{text-decoration:none;font-weight:700;color:inherit}nav a:hover{color:var(--soft)}
.hero{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--main);padding:6vh 5vw 8vh}
.hero h1{font-size:clamp(3rem,13vw,8rem);position:relative;z-index:2;text-shadow:.04em .04em 0 var(--deep);animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{opacity:0;translate:0 -.6em;rotate:-6deg}}@keyframes up{from{opacity:0;translate:0 24px}}
.sub{position:relative;z-index:2;max-width:36ch;font-size:1.05rem;font-weight:700;margin:14px auto 26px;animation:up .7s .5s both}
.sh{position:absolute;border-radius:50%;animation:fl 9s ease-in-out infinite}
.s1{width:min(50vw,480px);aspect-ratio:1;left:-8vw;top:8%;background:var(--mid)}.s2{width:12vw;height:12vw;right:7vw;bottom:12%;background:var(--deep);border-radius:0;rotate:20deg;animation-delay:-3s}
.s3{width:7vw;height:7vw;right:12vw;top:12%;background:var(--soft);border-radius:0;animation-delay:-5s}.s4{width:5vw;height:5vw;left:14vw;bottom:10%;background:var(--pale);animation-delay:-1s}
@keyframes fl{50%{translate:0 -24px;rotate:8deg}}
.gate{position:relative;z-index:2;width:min(480px,100%);background:var(--pale);color:var(--cardtxt);border-radius:26px;padding:28px 28px 26px;text-align:left;box-shadow:10px 10px 0 var(--deep);animation:up .7s .7s both}
.gate h2{font-size:1.9rem;margin-bottom:6px}.gate p{margin:0 0 14px}
.gate label{display:block;font-weight:800;margin-bottom:6px}
.gate input{width:100%;border:3px solid var(--main);border-radius:16px;padding:13px 16px;font:800 1.3rem "Plus Jakarta Sans",sans-serif;letter-spacing:.12em;background:#fff;color:var(--cardtxt)}
.err{color:#b91c1c;font-weight:800;min-height:1.4em;margin:6px 0 0}
.btn{display:inline-block;background:var(--main);color:#fff;border:0;border-radius:999px;padding:12px 24px;font:800 .95rem "Plus Jakarta Sans",sans-serif;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-3px) rotate(-1deg);background:var(--bg)}.btn.ghost{background:transparent;color:var(--cardtxt);box-shadow:inset 0 0 0 3px var(--main)}.btn.ghost:hover{background:var(--main);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.meth{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.meth li{display:flex;gap:12px;align-items:center;border:3px solid var(--soft);border-radius:16px;padding:10px 14px;background:#fff;opacity:.55}
.meth li.on{opacity:1;border-color:var(--main);background:var(--main);color:#fff}.meth li.skip{text-decoration:line-through}
.meth .ic{font-size:1.4rem}.meth small{display:block;font-weight:600;opacity:.85}
.pulse{width:78px;height:78px;border-radius:50%;background:var(--main);margin:6px auto 14px;animation:pl 1.4s ease-in-out infinite;display:grid;place-items:center;font-size:2rem}
@keyframes pl{50%{scale:1.12;box-shadow:0 0 0 14px rgba(109,40,217,.2)}}
.chk{list-style:none;padding:0;margin:0 0 4px;display:grid;gap:6px}.chk li{display:flex;gap:10px;opacity:.35;transition:.3s}.chk li.ok{opacity:1}.chk li.ok:before{content:"✓";color:var(--main);font-weight:800}.chk li:not(.ok):before{content:"○"}
.tok{background:var(--deep);color:var(--soft);border-radius:16px;padding:14px 16px;font:600 .85rem/1.5 ui-monospace,monospace;word-break:break-all;margin-top:10px}
.sim{position:relative;z-index:2;margin-top:34px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;animation:up .7s .9s both}
.sim span{font-weight:800;width:100%}.sim button{background:none;border:2px solid var(--soft);color:var(--txt);border-radius:999px;padding:6px 16px;font:700 .88rem "Plus Jakarta Sans",sans-serif;cursor:pointer}.sim button[aria-pressed=true],.sim button:hover{background:var(--soft);color:var(--ink)}
section{padding:8vh 5vw}.light{background:var(--pale);color:var(--cardtxt)}h2.t{font-size:clamp(2rem,4.5vw,3.2rem);margin-bottom:14px}.lead{max-width:60ch}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:26px}
.fc{background:var(--main);color:#fff;border-radius:22px;padding:22px}.fc .n{font:400 2.6rem/1 Baruta,sans-serif;color:var(--soft)}.fc h3{font-size:1.25rem;margin:8px 0}.fc p{margin:0}
.fc.last{background:var(--deep)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:26px}
.cols div{background:var(--deep);border-radius:22px;padding:24px}.cols h3{font-size:1.2rem;margin-bottom:8px;color:var(--soft)}.cols p{margin:0}
footer{background:var(--deep);padding:44px 5vw;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}footer .b{font-size:1.5rem}footer p{margin:0;opacity:.8;font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:700px){.gate{padding:22px}.gate input{font-size:1.1rem}nav div{gap:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="hero"><i class="sh s1"></i><i class="sh s2"></i><i class="sh s3"></i><i class="sh s4"></i>
<div class="gate" id="gate" aria-live="polite"></div>
</header>
<script>
const G=document.getElementById('gate'),M=[{k:'📱',n:'PlacetaID móvil',d:'Continúa en tu móvil para confirmar tu identidad.'},{k:'🔐',n:'Autentificador',d:'Se utiliza el sistema de autenticación actual.'},{k:'💻',n:'Placeta ID Desktop',d:'Se ha detectado una sesión activa en este dispositivo.'}];
const C=['Identidad válida','Aplicación autorizada','Servicios disponibles','Restricciones por edad','Permisos solicitados','Datos que la aplicación puede recibir'];
let dip='',T=[];const $=s=>G.querySelector(s);
function start(){T.forEach(clearTimeout);T=[];G.innerHTML=`<h2>PlacetaID</h2><p>Introduce tu DIP</p><label for="d">DIP:</label><input id="d" inputmode="numeric" maxlength="8" placeholder="12345678" autocomplete="off" value="${dip}"><p class="err" id="e"></p><div class="row"><button class="btn" id="go">Continuar</button></div>`;
const go=()=>{dip=$('#d').value.trim();if(!/^\d{8}$/.test(dip)){$('#e').textContent='El DIP tiene 8 dígitos.';return}detect()};$('#go').onclick=go;$('#d').onkeydown=e=>e.key==='Enter'&&go()}
function detect(){const d=+dip.slice(-1),i=d<=3?0:d<=6?1:d<=8?2:-1;
G.innerHTML=`<h2>DIP ${dip}</h2><p>Buscando cómo identificarte…</p><ul class="meth">${M.map((m,j)=>`<li class="${j===i?'on':j<i?'skip':''}"><span class="ic">${m.k}</span><span>${m.n}<small>${j===i?'Disponible':j<i?'No disponible':i<0?'No disponible':'Sin usar'}</small></span></li>`).join('')}</ul>`;
if(i<0){G.insertAdjacentHTML('beforeend',`<p>Ningún método disponible. Usa otro método para continuar.</p><div class="row"><button class="btn" id="o">Otro método</button><button class="btn ghost" id="b">Cambiar DIP</button></div>`);$('#o').onclick=()=>verify('Otro método');$('#b').onclick=start;return}
G.insertAdjacentHTML('beforeend',`<p>${M[i].d}</p><div class="row"><button class="btn" id="o">${i==0?'Confirmar en el móvil':i==1?'Abrir Autentificador':'Continuar'}</button><button class="btn ghost" id="b">Cambiar DIP</button></div>`);$('#o').onclick=()=>verify(M[i].n);$('#b').onclick=start}
function verify(n){G.innerHTML=`<div class="pulse">✓</div><h2>Confirmando…</h2><p>Mediante ${n}.</p>`;T.push(setTimeout(checks,1400))}
function checks(){G.innerHTML=`<h2>Comprobando</h2><p>Identidad confirmada. Revisando la solicitud:</p><ul class="chk">${C.map(c=>`<li>${c}</li>`).join('')}</ul>`;
G.querySelectorAll('.chk li').forEach((l,j)=>T.push(setTimeout(()=>{l.classList.add('ok');if(j==5)T.push(setTimeout(done,600))},500*(j+1))))}
function done(){G.innerHTML=`<h2>Autorizado</h2><p>PlacetaID devuelve a la aplicación la autorización correspondiente.</p><div class="tok">auth: concedida<br>dip: ${dip.slice(0,2)}••••${dip.slice(-2)}<br>alcance: servicios y datos permitidos</div><div class="row"><button class="btn" id="r">Reiniciar</button></div>`;$('#r').onclick=()=>{dip='';start()}}
start();
</script></body></html>
